[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvp-core"
version = "0.1.0"
description = "Shared kernel of the exam generator: models, bank, migrations, clients"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
    "jinja2>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
